<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; }
  pre {
    margin: 0;
    color: #ddd;
    /* a thin monospace keeps every stroke one hairline wide */
    font: 10px/10px "Courier New", Courier, ui-monospace, Menlo, Consolas, monospace;
    white-space: pre;
    cursor: pointer;
    user-select: none;
  }
  #hint {
    position: fixed; right: 14px; bottom: 10px;
    font: 11px "Courier New", monospace; color: #3a3a48;
    pointer-events: none;
  }
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="hint">click to replay</div>
<script>
const scr = document.getElementById('screen');
const TAU = Math.PI * 2;

/* ------------------------------------------------------------------ *
 *  small helpers
 * ------------------------------------------------------------------ */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function tint(c, k) {
  k = Math.round(clamp(k, 0, 1.3) * 24) / 24;            // quantised so spans merge
  return `rgb(${Math.min(255, c[0] * k | 0)},${Math.min(255, c[1] * k | 0)},${Math.min(255, c[2] * k | 0)})`;
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

/* ------------------------------------------------------------------ *
 *  colours
 * ------------------------------------------------------------------ */
const INK    = hex('#fffdf7');
const PAPER  = hex('#f3efe6');
const LINER  = hex('#ff8fbf');
const SEAL   = hex('#ff3d5e');
const GOLD   = hex('#ffd36b');
const KRAFT  = hex('#e9c9a0');
const RIB    = hex('#ff6fa8');
const GREEN  = hex('#5fbf6a');
const LEAF   = hex('#86d47c');
const SAGE   = hex('#a9c9a2');
const STAR   = hex('#9aa4d0');
const PAL = ['#ff3b5c', '#ff6fb5', '#ff9e8a', '#ff9440', '#f4f0ff', '#b896ff', '#ffd84d'].map(hex);

/* ------------------------------------------------------------------ *
 *  the character grid (+ colour and a depth buffer so things occlude)
 * ------------------------------------------------------------------ */
let cols = 1, rows = 1, cw = 6, chh = 10, W = 0, H = 0;
let G = [], C = [], Z = new Float64Array(0);
let stars = [], petals = [];

function resize() {
  chh = parseFloat(getComputedStyle(scr).lineHeight) || 10;
  const probe = document.createElement('span');
  probe.textContent = 'M'.repeat(50);
  scr.textContent = '';
  scr.appendChild(probe);
  cw = probe.getBoundingClientRect().width / 50;
  probe.remove();
  cols = Math.max(1, Math.floor(innerWidth / cw));
  rows = Math.max(1, Math.floor(innerHeight / chh));
  W = cols * cw; H = rows * chh;
  const n = cols * rows;
  G = new Array(n); C = new Array(n); Z = new Float64Array(n);
  stars = [];
  for (let i = 0; i < n / 90; i++)
    stars.push([Math.random() * cols | 0, Math.random() * rows | 0, Math.random() * TAU, .4 + Math.random() * 1.6]);
  petals = [];
  for (let i = 0; i < 30; i++)
    petals.push({ x: Math.random(), y: Math.random(), v: .025 + Math.random() * .04, ph: Math.random() * TAU, c: PAL[i % PAL.length] });
}
addEventListener('resize', resize);

function clear() { G.fill(' '); C.fill(null); Z.fill(Infinity); }

function put(i, ch, col, z, tol = 0) {
  if (z <= Z[i] + tol) { G[i] = ch; C[i] = col; Z[i] = z; return true; }
  return false;
}
function plotPx(x, y, ch, col, z) {
  const c = Math.floor(x / cw), r = Math.floor(y / chh);
  if (c < 0 || c >= cols || r < 0 || r >= rows) return;
  put(r * cols + c, ch, col, z);
}

// Pick a glyph that follows the direction of the line through this cell.
// Shallow slopes become a classic  _.-'  staircase instead of a run of ////.
function charFor(dx, dy, fy) {
  const ax = Math.abs(dx / cw), ay = Math.abs(dy / chh);
  if (ay < ax * 0.2) return fy > 0.6 ? '_' : '-';
  if (ay > ax * 2.5) return '|';
  const up = (dx > 0) !== (dy > 0);
  if (ay < ax * 0.65) {
    if (fy > 0.72) return '_';
    if (fy > 0.5) return '.';
    if (fy > 0.28) return '-';
    return up ? '\'' : '`';
  }
  return up ? '/' : '\\';
}

// Draw a polyline of [x, y, z] points in pixel space as a one-character-thin
// line. "L" shaped corners (which make diagonals look doubled) are pruned.
function stroke(pts, col, closed, tol = 0) {
  const n = pts.length;
  if (n < 2) return;
  const segs = closed ? n : n - 1;
  let last = -1, p1 = null, p2 = null;
  for (let k = 0; k < segs; k++) {
    const a = pts[k], b = pts[(k + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) continue;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx) / cw, Math.abs(dy) / chh) * 2));
    for (let j = 0; j < steps; j++) {
      const t = j / steps;
      const x = a[0] + dx * t, y = a[1] + dy * t, z = a[2] + (b[2] - a[2]) * t;
      const fr = y / chh;
      const c = Math.floor(x / cw), r = Math.floor(fr);
      if (c < 0 || c >= cols || r < 0 || r >= rows) { last = -1; p1 = p2 = null; continue; }
      const i = r * cols + c;
      if (i === last) continue;
      if (p1 && p2 && Math.abs(p2.c - c) === 1 && Math.abs(p2.r - r) === 1 &&
          ((p1.c === p2.c && p1.r === r) || (p1.r === p2.r && p1.c === c))) {
        if (p1.w) { G[p1.i] = p1.g; C[p1.i] = p1.col; Z[p1.i] = p1.z; }
        p1 = p2; p2 = null;
      }
      const rec = { i, c, r, g: G[i], col: C[i], z: Z[i], w: false };
      rec.w = put(i, charFor(dx, dy, fr - r), col, z, tol);
      p2 = p1; p1 = rec; last = i;
    }
  }
}

function render() {
  let out = '';
  for (let r = 0; r < rows; r++) {
    let cur = null, open = false;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, ch = G[i];
      if (ch === ' ') { out += ' '; continue; }
      const col = C[i];
      if (col !== cur) {
        if (open) out += '</span>';
        out += '<span style="color:' + col + '">';
        cur = col; open = true;
      }
      out += ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
    }
    if (open) out += '</span>';
    out += '\n';
  }
  scr.innerHTML = out;
}

/* ------------------------------------------------------------------ *
 *  background
 * ------------------------------------------------------------------ */
function drawStars(t) {
  for (const s of stars) {
    const b = 0.5 + 0.5 * Math.sin(t * s[3] + s[2]);
    const ch = b > 0.93 ? '+' : b > 0.45 ? '·' : '.';
    put(s[1] * cols + s[0], ch, tint(STAR, 0.18 + 0.32 * b), 1e9);
  }
}

function drawPetals(t, fade) {
  const chs = [',', '\'', '`', '.'];
  for (const p of petals) {
    const y = (((p.y + t * p.v) % 1.1) - 0.05) * H;
    const x = p.x * W + Math.sin(t * 0.9 + p.ph) * cw * 5;
    const ch = chs[Math.floor(t * 3 + p.ph * 3) % chs.length];
    plotPx(x, y, ch, tint(p.c, 0.75 * fade), 1e8);
  }
}

/* ------------------------------------------------------------------ *
 *  1 + 2 : the envelope grows and opens
 * ------------------------------------------------------------------ */
function drawEnvelope(s, o, t, fade = 1) {
  const ZF = 2e5, ZB = 3e5;    // always behind the bouquet
  const EW = Math.min(W * 0.62, H * 0.56 * 1.5);
  const w = Math.max(cw * 2, EW * s), h = w / 1.5;
  const cx = W / 2, cy = H / 2 + h * 0.26 * o;
  const L = cx - w / 2, R = cx + w / 2, T = cy - h / 2, B = cy + h / 2;
  const cosA = Math.cos(o * Math.PI);
  const tipY = T + h * 0.56 * cosA;
  const front = cosA > 0;

  const paper = tint(PAPER, 0.42 * fade), paper2 = tint(PAPER, 0.58 * fade), line = tint(INK, fade);

  // twinkles orbiting the envelope while it arrives
  const tw = smooth(0.2, 1.4, t);
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU + t * 0.45;
    const b = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.7);
    const x = cx + Math.cos(a) * (w * 0.62 + cw * 3);
    const y = cy + Math.sin(a) * (h * 0.78 + chh * 2);
    plotPx(x, y, b > 0.8 ? '*' : b > 0.4 ? '+' : '·', tint(GOLD, b * tw * 0.9 * fade), ZB + 500);
  }

  // body: a faint paper grain so it reads as a white sheet, not just an outline
  const r0 = Math.max(0, Math.floor(T / chh)), r1 = Math.min(rows - 1, Math.floor(B / chh));
  const c0 = Math.max(0, Math.floor(L / cw)), c1 = Math.min(cols - 1, Math.floor(R / cw));
  if (fade > 0.3) for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const x = (c + .5) * cw, y = (r + .5) * chh;
    if (x < L || x > R || y < T || y > B) continue;
    const hh = hash(c, r);
    put(r * cols + c, hh < 0.05 ? '.' : hh < 0.075 ? '·' : ' ', paper, ZF + 100);
  }

  // the side folds: diagonals from the top corners down towards the middle
  const sideY = cy + h * 0.22;
  const sideK = smooth(0.45, 0.85, o);   // tucked under the top flap until it opens
  if (sideK > 0) {
    stroke([[L, T, ZF + 60], [cx, sideY, ZF + 60]], tint(INK, 0.6 * fade * sideK), false);
    stroke([[R, T, ZF + 60], [cx, sideY, ZF + 60]], tint(INK, 0.6 * fade * sideK), false);
  }

  // the bottom flap: a pointed fold that overlaps the side folds
  const bApex = cy - h * 0.04;
  for (let r = Math.max(0, Math.floor(bApex / chh)); r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const x = (c + .5) * cw, y = (r + .5) * chh;
    const f = (B - y) / (B - bApex);
    if (f < 0 || f > 1 || Math.abs(x - cx) > (w / 2) * (1 - f)) continue;
    const hh = hash(c + 3, r + 11);
    put(r * cols + c, hh < 0.045 ? '.' : ' ', paper2, ZF + 55);
  }
  stroke([[L, B, ZF + 50], [cx, bApex, ZF + 50], [R, B, ZF + 50]], tint(INK, 0.8 * fade), false);

  // the top flap (rotates up and over as it opens)
  if (Math.abs(tipY - T) > 1) {
    const fy0 = Math.max(0, Math.floor(Math.min(T, tipY) / chh));
    const fy1 = Math.min(rows - 1, Math.floor(Math.max(T, tipY) / chh));
    for (let r = fy0; r <= fy1; r++) for (let c = c0; c <= c1; c++) {
      const x = (c + .5) * cw, y = (r + .5) * chh;
      const f = (y - T) / (tipY - T);
      if (f < 0 || f > 1 || Math.abs(x - cx) > (w / 2) * (1 - f)) continue;
      const i = r * cols + c;
      if (front) {
        const hh = hash(c + 7, r);
        put(i, hh < 0.05 ? '.' : ' ', paper2, ZF + 20);
      } else {
        // patterned liner on the inside of the flap
        const m1 = ((c + r) % 6 + 6) % 6, m2 = ((c - r) % 6 + 6) % 6;
        const ch = m1 === 0 && m2 === 0 ? 'x' : m1 === 0 ? '/' : m2 === 0 ? '\\' : ' ';
        put(i, ch, tint(LINER, 0.5 * fade), ZB + 150);
      }
    }
  }

  stroke([[L, T, ZF + 50], [L, B, ZF + 50]], line, false);
  stroke([[R, T, ZF + 50], [R, B, ZF + 50]], line, false);
  // solid horizontal edges: the fold under the flap stays on top of everything
  const rowT = Math.round(T / chh) - 1, rowB = Math.round(B / chh) - 1;
  for (let c = Math.max(0, Math.round(L / cw)); c <= Math.min(cols - 1, Math.round(R / cw) - 1); c++) {
    if (rowT >= 0 && rowT < rows) put(rowT * cols + c, '_', line, ZF + 1);
    if (rowB >= 0 && rowB < rows) put(rowB * cols + c, '_', line, ZF + 50);
  }
  const zf = front ? ZF + 10 : ZB + 140;
  stroke([[L, T, zf], [cx, tipY, zf], [R, T, zf]], front ? line : tint(INK, 0.85 * fade), false);

  // a little heart seal on the flap tip
  if (cosA > 0.15 && w > cw * 12) {
    const k = clamp((cosA - 0.15) / 0.3);
    const hs = h * 0.075, sy = cosA, pts = [];
    for (let i = 0; i < 72; i++) {
      const a = i / 72 * TAU, sa = Math.sin(a);
      const hx = 16 * sa * sa * sa;
      const hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
      pts.push([cx + hx / 17 * hs, tipY + hy / 17 * hs * sy, ZF + 5]);
    }
    for (const p of pts) for (let q = 0; q < 1; q += 0.12)
      plotPx(lerp(cx, p[0], q), lerp(tipY, p[1], q), ' ', null, ZF + 6);
    stroke(pts, tint(SEAL, k), true);
  }
}

/* ------------------------------------------------------------------ *
 *  3 : the bouquet rises out of the envelope and spins (real 3D, projected onto the grid)
 * ------------------------------------------------------------------ */
const TILT = 0.45;
let OX = 0, OY = 0, DD = 1, CS = 1, SN = 0;
let SC = 1, PX = 0, PY = 0;   // whole-bouquet zoom about a pivot (used while it grows in)
const CT = Math.cos(TILT), ST = Math.sin(TILT);

function geo() {
  const U = Math.min(H * 0.9, W * 0.72);
  return { U, ox: W / 2, oy: H / 2 + U * 0.03, D: U * 2.4,
           Rd: U * 0.3, y0: -U * 0.04, yRim: U * 0.02, Rr: U * 0.27, yB: U * 0.46, yRib: U * 0.27 };
}
// spin around the vertical axis, then tilt so we look down on it a little
function rot(p) {
  const x = p[0] * CS + p[2] * SN, z = -p[0] * SN + p[2] * CS, y = p[1];
  return [x, y * CT - z * ST, z * CT + y * ST];
}
function proj(v, z) {
  const s = DD / (DD + v[2]);
  return [PX + (OX + v[0] * s - PX) * SC, PY + (OY + v[1] * s - PY) * SC, z === undefined ? v[2] : z];
}
const P3 = (p, dz = 0) => { const v = rot(p); return proj(v, v[2] + dz); };

// Each flower is a closed polar curve r(angle) - so every petal is one thin line.
const TYPES = {
  rose:   { col: hex('#ff3b5c'), spiral: true,
            layers: [{ f: a => 0.84 + 0.16 * Math.sqrt(Math.abs(Math.sin(2.5 * a))), s: 1 },
                     { f: a => 0.78 + 0.22 * Math.abs(Math.sin(2.5 * a + 1.3)), s: 0.68, k: 1.15 }] },
  daisy:  { col: hex('#f4f0ff'), k: 4, veins: true, center: { r: 0.24, c: hex('#ffc93c') },
            layers: [{ f: a => 0.22 + 0.78 * Math.pow(Math.abs(Math.cos(4 * a)), 0.6), s: 1 }] },
  cosmos: { col: hex('#ff6fb5'), k: 2.5, veins: true, center: { r: 0.18, c: hex('#ffe066') },
            layers: [{ f: a => 0.28 + 0.72 * Math.pow(Math.abs(Math.cos(2.5 * a)), 0.45), s: 1 }] },
  lily:   { col: hex('#ff9440'), k: 3, veins: true, stamens: true, center: { r: 0.1, c: hex('#ffe9a8') },
            layers: [{ f: a => 0.1 + 0.9 * Math.pow(Math.abs(Math.cos(3 * a)), 1.3), s: 1 }] },
  peony:  { col: hex('#ff9e8a'), center: { r: 0.12, c: hex('#ffd6a5') },
            layers: [{ f: a => 0.86 + 0.14 * Math.abs(Math.cos(3.5 * a)), s: 1 },
                     { f: a => 0.82 + 0.18 * Math.abs(Math.cos(3.5 * a + 0.9)), s: 0.68, k: 1.1 },
                     { f: a => 0.75 + 0.25 * Math.abs(Math.cos(2.5 * a + 0.3)), s: 0.4, k: 1.2 }] },
  aster:  { col: hex('#b896ff'), k: 5, veins: true, center: { r: 0.2, c: hex('#ffd84d') },
            layers: [{ f: a => 0.2 + 0.8 * Math.pow(Math.abs(Math.cos(5 * a)), 0.8), s: 1 }] },
};

const FLOWERS = [];
function addRing(n, phi, off, types, size, delay) {
  for (let k = 0; k < n; k++) FLOWERS.push({
    phi, th: off + k * TAU / n + (hash(k, phi * 10) - .5) * 0.3,
    type: types[k % types.length],
    size: size * (0.9 + 0.2 * hash(phi * 10, k)),
    spd: (0.3 + 0.5 * hash(k + 3, phi)) * (k % 2 ? 1 : -1),
    ph: hash(k, 7 + phi) * TAU, delay,
  });
}
addRing(1, 0, 0, ['rose'], 1.15, 0);
addRing(5, 0.62, 0.3, ['peony', 'daisy', 'lily', 'cosmos', 'aster'], 0.95, 0.12);
addRing(6, 1.08, 0, ['cosmos', 'rose', 'daisy', 'aster', 'peony', 'lily'], 0.88, 0.24);
addRing(6, 1.42, 0.5, ['daisy', 'cosmos', 'aster'], 0.6, 0.36);

const FILLERS = [];
for (let k = 0; k < 12; k++)
  FILLERS.push({ phi: 0.85 + 0.5 * hash(k, 31), th: k * TAU / 12 + 0.2, ph: hash(k, 9) * TAU });

function headPos(phi, th, Gm, r = 1) {
  return [Gm.Rd * r * Math.sin(phi) * Math.cos(th), Gm.y0 - Gm.Rd * r * Math.cos(phi), Gm.Rd * r * Math.sin(phi) * Math.sin(th)];
}
const depthK = (z, Rd) => 0.55 + 0.45 * clamp((Rd - z) / (2 * Rd));

function drawWrap(Gm, gw, eps) {
  const { U, Rr, yB, yRim, yRib } = Gm;
  const sc = 0.5 + 0.5 * gw;
  const S = p => [p[0] * sc, yRib + (p[1] - yRib) * sc, p[2] * sc];
  const wrapPt = (b, s) => {
    const rr = Rr * (1 + 0.05 * Math.sin(b * 9)) * s;
    return S([rr * Math.cos(b), lerp(yB, yRim - U * 0.014 * Math.cos(b * 9), s), rr * Math.sin(b)]);
  };
  const Ld = norm([-0.45, -0.5, -0.75]);

  // paper surface: grain that turns with the bouquet
  const ns = Math.ceil((yB - yRim) * sc / (chh * 0.5));
  for (let i = 0; i <= ns; i++) {
    const s = i / ns;
    const nb = Math.max(12, Math.ceil(TAU * Rr * s * sc / (cw * 0.6)));
    for (let k = 0; k < nb; k++) {
      const b = k / nb * TAU;
      const p = proj(rot(wrapPt(b, s)));
      const nv = rot(norm([Math.cos(b), 0.55, Math.sin(b)]));
      let lit = nv[0] * Ld[0] + nv[1] * Ld[1] + nv[2] * Ld[2];
      lit = nv[2] > 0 ? Math.abs(lit) * 0.5 : clamp(lit);
      const hh = hash(i, k);
      const ch = hh < 0.04 + 0.16 * lit ? (hh < 0.02 ? ',' : '.') : ' ';
      plotPx(p[0], p[1], ch, tint(KRAFT, (0.25 + 0.45 * lit) * gw), p[2]);
    }
  }
  const apex = P3(S([0, yB, 0]), -eps);
  // folds
  for (let k = 0; k < 7; k++) {
    const b = k / 7 * TAU + 0.2, pts = [];
    for (let i = 0; i <= 10; i++) pts.push(P3(wrapPt(b, i / 10), -eps));
    stroke(pts, tint(KRAFT, 0.6 * gw), false);
  }
  // ruffled rim
  const rim = [];
  for (let k = 0; k < 180; k++) rim.push(P3(wrapPt(k / 180 * TAU, 1), -eps));
  stroke(rim, tint(KRAFT, 0.95 * gw), true);
  // outline of the cone
  let lo = 0, hi = 0;
  rim.forEach((p, i) => { if (p[0] < rim[lo][0]) lo = i; if (p[0] > rim[hi][0]) hi = i; });
  stroke([apex, [rim[lo][0], rim[lo][1], rim[lo][2] - eps]], tint(KRAFT, 0.95 * gw), false);
  stroke([apex, [rim[hi][0], rim[hi][1], rim[hi][2] - eps]], tint(KRAFT, 0.95 * gw), false);
  // ribbon band
  const sR = (yB - yRib) / (yB - yRim), rr = Rr * sR * 1.03, band = [];
  for (let k = 0; k < 120; k++) {
    const b = k / 120 * TAU;
    band.push(P3(S([rr * Math.cos(b), yRib, rr * Math.sin(b)]), -2 * eps));
  }
  stroke(band, tint(RIB, gw), true);
  return rr * sc;
}

function drawBow(Gm, rr, gw, t) {
  const v = [0, Gm.yRib * CT + rr * ST, -rr * CT + Gm.yRib * ST];
  const [bx, by] = proj(v);
  const bs = Gm.U * 0.06 * gw, z = -1e4, col = tint(RIB, gw);
  const loop = [];
  for (let i = 0; i < 140; i++) {
    const a = i / 140 * TAU, d = 1 + Math.sin(a) * Math.sin(a);
    loop.push([bx + bs * 1.5 * Math.cos(a) / d, by + bs * 1.1 * Math.sin(a) * Math.cos(a) / d - bs * 0.05, z]);
  }
  for (const p of loop) for (let q = 0; q < 1; q += 0.2) plotPx(lerp(bx, p[0], q), lerp(by, p[1], q), ' ', null, z + 1);
  stroke(loop, col, true);
  for (const side of [-1, 1]) {
    const tail = [];
    for (let i = 0; i <= 16; i++) {
      const s = i / 16;
      tail.push([bx + side * bs * (0.15 + 0.55 * s) + Math.sin(s * 4 + t * 2 + side) * bs * 0.12, by + bs * (0.15 + 1.9 * s), z]);
    }
    stroke(tail, col, false);
  }
  plotPx(bx, by, 'o', tint(RIB, 1.2 * gw), z - 1);
}

function drawLeaves(Gm, gw, eps) {
  const { U, Rr, yRim, Rd } = Gm;
  for (let k = 0; k < 9; k++) {
    const b = k * TAU / 9 + 0.35, Lh = U * 0.15 * (0.8 + 0.4 * hash(k, 2)) * gw;
    const base = [Rr * 0.8 * Math.cos(b), yRim + U * 0.01, Rr * 0.8 * Math.sin(b)];
    const out = [Math.cos(b), 0, Math.sin(b)], side = [-Math.sin(b), 0, Math.cos(b)];
    const at = (s, wf) => [base[0] + out[0] * Lh * s * 0.9 + side[0] * wf,
                           base[1] + Lh * (-0.8 * s + 0.45 * s * s),
                           base[2] + out[2] * Lh * s * 0.9 + side[2] * wf];
    const zc = rot(base)[2], dk = depthK(zc, Rd) * gw;
    const left = [], right = [], mid = [];
    for (let i = 0; i <= 16; i++) {
      const s = i / 16, wf = Lh * 0.22 * Math.pow(Math.sin(Math.PI * s), 0.8);
      for (let j = -4; j <= 4; j++) { const p = P3(at(s, wf * j / 4)); plotPx(p[0], p[1], ' ', null, p[2]); }
      left.push(P3(at(s, wf), -eps)); right.unshift(P3(at(s, -wf), -eps)); mid.push(P3(at(s, 0), -eps * 0.5));
    }
    stroke(left.concat(right), tint(LEAF, dk), true);
    stroke(mid, tint(GREEN, dk * 0.7), false);
  }
}

function drawStem(Pw, Gm, g, eps) {
  const T = [0, Gm.yRib, 0];
  const M = [(T[0] + Pw[0]) / 2 * 1.2, (T[1] + Pw[1]) / 2, (T[2] + Pw[2]) / 2 * 1.2];
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const s = i / 14, a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, c = s * s;
    pts.push(P3([a * T[0] + b * M[0] + c * Pw[0], a * T[1] + b * M[1] + c * Pw[1], a * T[2] + b * M[2] + c * Pw[2]], eps));
  }
  const zc = rot(Pw)[2];
  stroke(pts, tint(GREEN, depthK(zc, Gm.Rd) * 0.6 * g), false);
}

function drawHead(f, g, t, Gm) {
  const tp = TYPES[f.type];
  const bloom = easeOut((g - f.delay) / 0.55);
  if (bloom <= 0) return;
  const gs = easeOut((g - f.delay * 0.5) / 0.6);
  const T = [0, Gm.yRib, 0], Hw = headPos(f.phi, f.th, Gm);
  const Pw = [lerp(T[0], Hw[0], gs), lerp(T[1], Hw[1], gs), lerp(T[2], Hw[2], gs)];
  const eps = Gm.U * 0.001;
  drawStem(Pw, Gm, gs, eps);

  const nw = [Math.sin(f.phi) * Math.cos(f.th), -Math.cos(f.phi), Math.sin(f.phi) * Math.sin(f.th)];
  const nv = rot(nw), Cv = rot(Pw);
  const facing = -nv[2];
  // half way between "facing outward" and "facing the viewer" so no flower goes edge-on
  const n = norm([nv[0] * 0.5, nv[1] * 0.5, nv[2] * 0.5 - 0.5]);
  let u = cross([0, 1, 0], n);
  u = len(u) < 1e-3 ? [1, 0, 0] : norm(u);
  const v = cross(n, u);
  const R = Gm.U * 0.095 * f.size * bloom;
  const dk = depthK(Cv[2], Gm.Rd) * (0.55 + 0.45 * clamp(facing * 0.5 + 0.5)) * clamp(bloom * 1.5);
  const zc = Cv[2], e = Gm.U * 0.001;
  const spinA = t * f.spd + f.ph + (1 - bloom) * 2.5;
  const cup = R * 0.18;
  const L = (a, rn, z) => {
    const lx = Math.cos(a) * rn * R, ly = Math.sin(a) * rn * R, h = cup * rn * rn;
    const p = [Cv[0] + u[0] * lx + v[0] * ly + n[0] * h,
               Cv[1] + u[1] * lx + v[1] * ly + n[1] * h,
               Cv[2] + u[2] * lx + v[2] * ly + n[2] * h];
    return proj(p, z);
  };
  const Rp = R * DD / (DD + zc);

  // petal surface (blank, so the flower hides what is behind it) + speckled centre
  const outer = tp.layers[0];
  const nr = Math.max(2, Math.ceil(Rp / (chh * 0.4)));
  for (let i = 0; i < nr; i++) {
    const rn = (i + 0.5) / nr;
    const na = Math.max(8, Math.ceil(TAU * rn * Rp / (cw * 0.5)));
    for (let k = 0; k < na; k++) {
      const a = k / na * TAU;
      if (rn > outer.f(a - spinA) * outer.s) continue;
      if (tp.center && rn < tp.center.r) {
        const hh = hash(i, k + Math.floor(spinA * 3));
        const p = L(a, rn, zc - 3 * e);
        plotPx(p[0], p[1], hh < .45 ? 'o' : hh < .7 ? '.' : hh < .85 ? '*' : '°', tint(tp.center.c, dk * (0.8 + 0.4 * hh)), p[2]);
      } else {
        const p = L(a, rn, zc);
        plotPx(p[0], p[1], ' ', null, p[2]);
      }
    }
  }

  // petal outlines
  for (const ly of tp.layers) {
    const NA = Math.min(400, Math.max(48, Math.ceil(TAU * Rp * ly.s / (cw * 0.3))));
    const pts = [];
    for (let k = 0; k < NA; k++) {
      const a = k / NA * TAU, r = ly.f(a - spinA) * ly.s;
      pts.push(L(a, r, zc - 2 * e));
    }
    stroke(pts, tint(tp.col, dk * (ly.k || 1)), true);
  }

  // veins down the middle of each petal
  if (tp.veins) {
    const nV = Math.round(2 * tp.k), r0 = tp.center ? tp.center.r + 0.04 : 0.1;
    for (let m = 0; m < nV; m++) {
      const a = m * Math.PI / tp.k + spinA, r1 = 0.6 * outer.f(a - spinA), pts = [];
      for (let i = 0; i <= 5; i++) pts.push(L(a, lerp(r0, r1, i / 5), zc - e));
      stroke(pts, tint(tp.col, dk * 0.5), false);
    }
  }
  if (tp.stamens) {
    for (let m = 0; m < 6; m++) {
      const a = (m + 0.5) * Math.PI / tp.k + spinA, pts = [];
      for (let i = 0; i <= 4; i++) pts.push(L(a, lerp(0.1, 0.5, i / 4), zc - 3 * e));
      stroke(pts, tint(GOLD, dk * 0.9), false);
      const q = pts[pts.length - 1];
      plotPx(q[0], q[1], '*', tint(GOLD, dk * 1.1), zc - 4 * e);
    }
  }
  if (tp.spiral) {
    const pts = [];
    for (let i = 0; i <= 90; i++) {
      const s = i / 90;
      pts.push(L(s * TAU * 2.6 + spinA * 1.6, 0.05 + 0.48 * s, zc - 2 * e));
    }
    stroke(pts, tint(tp.col, dk * 1.25), false);
  }
}

function drawFiller(fl, g, t, Gm, eps) {
  const gs = easeOut((g - 0.3) / 0.6);
  if (gs <= 0) return;
  const T = [0, Gm.yRib, 0], Hw = headPos(fl.phi, fl.th, Gm, 1.05);
  const Pw = [lerp(T[0], Hw[0], gs), lerp(T[1], Hw[1], gs), lerp(T[2], Hw[2], gs)];
  drawStem(Pw, Gm, gs * 0.7, eps);
  const nw = norm([Math.sin(fl.phi) * Math.cos(fl.th), -Math.cos(fl.phi), Math.sin(fl.phi) * Math.sin(fl.th)]);
  let u = cross([0, 1, 0], nw); u = len(u) < 1e-3 ? [1, 0, 0] : norm(u);
  const v = cross(nw, u);
  const Ls = Gm.U * 0.055 * gs, zc = rot(Pw)[2], dk = depthK(zc, Gm.Rd) * gs;
  const base = P3(Pw);
  for (let m = 0; m < 6; m++) {
    const a = m * TAU / 6 + fl.ph + Math.sin(t * 0.8 + m) * 0.15;
    const l = Ls * (0.7 + 0.5 * hash(m, fl.ph));
    const end = [Pw[0] + (u[0] * Math.cos(a) + v[0] * Math.sin(a)) * l + nw[0] * l * 0.5,
                 Pw[1] + (u[1] * Math.cos(a) + v[1] * Math.sin(a)) * l + nw[1] * l * 0.5,
                 Pw[2] + (u[2] * Math.cos(a) + v[2] * Math.sin(a)) * l + nw[2] * l * 0.5];
    const pe = P3(end);
    stroke([base, pe], tint(SAGE, dk * 0.6), false);
    const tw = 0.75 + 0.25 * Math.sin(t * 2.5 + m * 2 + fl.ph);
    plotPx(pe[0], pe[1], m % 3 === 0 ? 'o' : m % 3 === 1 ? '*' : '°', tint(INK, dk * tw), pe[2] - eps);
  }
}

function drawBouquet(t, g, sc = 1, px = 0, py = 0) {
  const Gm = geo();
  OX = Gm.ox; OY = Gm.oy; SC = sc; PX = px; PY = py; DD = Gm.D;
  const spin = t * 0.42;
  CS = Math.cos(spin); SN = Math.sin(spin);
  const gw = easeOut(g / 0.4);
  if (gw <= 0) return;
  const eps = Gm.U * 0.035;
  const rr = drawWrap(Gm, gw, eps);
  drawLeaves(Gm, gw, eps);
  for (const fl of FILLERS) drawFiller(fl, g, t, Gm, eps);
  for (const f of FLOWERS) drawHead(f, g, t, Gm);
  drawBow(Gm, rr, gw, t);
}

/* ------------------------------------------------------------------ *
 *  timeline
 * ------------------------------------------------------------------ */
const T_GROW = 3.8;           // envelope grows from a dot
const T_OPEN0 = 1.2, T_OPEN1 = 4.3;   // ...and opens while growing
const T_BLOOM = 4.6;          // bouquet starts growing out of the envelope's middle
const T_BOUQ = 3.2;           // how long the bouquet takes to grow to full size
const T_SHRINK = 2.6;         // how long the envelope takes to shrink away

let start = performance.now();

function frame(now) {
  const t = (now - start) / 1000;
  clear();
  drawStars(t);
  if (t < T_BLOOM) {
    drawEnvelope(0.04 + 0.96 * easeOut(t / T_GROW), smooth(T_OPEN0, T_OPEN1, t), t);
  } else {
    const tt = t - T_BLOOM;
    // the envelope shrinks back to nothing, behind the bouquet
    const e = easeInOut(tt / T_SHRINK);
    if (e < 0.98) drawEnvelope(1 - e, 1, t, 1 - e * 0.6);
    // the bouquet grows out of the envelope's centre, just like the envelope grew out of the screen
    const EW = Math.min(W * 0.62, H * 0.56 * 1.5);
    const sc = 0.03 + 0.97 * easeOut(tt / T_BOUQ);
    drawBouquet(t, clamp(tt / (T_BOUQ * 0.9)), sc, W / 2, H / 2 + (EW / 1.5) * 0.26);
    if (tt > 2.5) drawPetals(t, clamp((tt - 2.5) / 2));
  }
  render();
  requestAnimationFrame(frame);
}

scr.addEventListener('click', () => { start = performance.now(); });

resize();
requestAnimationFrame(frame);
</script>
